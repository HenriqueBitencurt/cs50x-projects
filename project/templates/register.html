{% extends "layout.html" %}

{% block title %}
    Registo
{% endblock %}

{% block main %}
    <div class="container mt-5" style="max-width: 400px;">
        <h2 class="mb-4">Criar Conta</h2>
        <form action="/register" method="post">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Nome de Utilizador</label>
                <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Username" type="text" required>
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Palavra-passe</label>
                <input class="form-control" id="password" name="password" placeholder="Password" type="password" required>
            </div>
            <div class="mb-3 text-start">
                <label for="confirmation" class="form-label">Confirmar Palavra-passe</label>
                <input class="form-control" id="confirmation" name="confirmation" placeholder="Confirmar password" type="password" required>
            </div>
            <button class="btn btn-primary w-100 mt-2" type="submit">Registar</button>
        </form>
        <p class="mt-3 text-muted">Já tens conta? <a href="/login">Entrar</a>.</p>
    </div>
{% endblock %}
