{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}


    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Entrar no StudySync</h2>

                        <form action="/login" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Utilizador</label>
                                <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Nome de utilizador" type="text" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Palavra-passe</label>
                                <input class="form-control" id="password" name="password" placeholder="Palavra-passe" type="password" required>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-primary" type="submit">Entrar</button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <p class="small text-muted">Ainda não tens conta? <a href="/register">Regista-te aqui</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
