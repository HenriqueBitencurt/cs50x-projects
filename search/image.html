<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-nav">
        <a href="index.html">Pesquisa Google</a>
    </header>

    <main class="search-container">
        <div class="logo">
            <span style="color: #4285F4;">G</span><span style="color: #EA4335;">o</span><span style="color: #FBBC05;">o</span><span style="color: #4285F4;">g</span><span style="color: #34A853;">l</span><span style="color: #EA4335;">e</span><span class="sub-logo">imagens</span>
        </div>

        <!-- tbm=isch é o parâmetro GET que ativa a busca por imagens do Google -->
        <form action="https://www.google.com/search" method="GET">
            <input type="hidden" name="tbm" value="isch">
            <div class="search-bar-wrapper">
                <input type="text" name="q" class="search-bar" autofocus required>
            </div>
            <div class="buttons-container">
                <input type="submit" value="Pesquisa de Imagens" class="btn">
            </div>
        </form>
    </main>
</body>
</html>
